name: Playwright Tests
on:
  push:
    branches: [main, master, stage]
  pull_request:
    branches: [main, master, stage]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium
          - firefox
          - webkit
          - api
          - "Mobile Safari - iPhone 14"
          - "Mobile Chrome - Pixel 7"
          - accessibility
          - performance
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (${{ matrix.project }})
        run: npx playwright test --project="${{ matrix.project }}"

      - name: Sanitize artifact name
        if: ${{ !cancelled() }}
        run: echo "ARTIFACT_SAFE_NAME=$(echo '${{ matrix.project }}' | tr -c 'a-zA-Z0-9_-' '-')" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: raw-blob-report-${{ env.ARTIFACT_SAFE_NAME }}
          path: blob-report/
          retention-days: 7

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: raw-allure-results-${{ env.ARTIFACT_SAFE_NAME }}
          path: allure-results/
          retention-days: 7

  merge-reports:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v7
        with:
          pattern: raw-blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge into a single HTML report
        run: npx playwright merge-reports --reporter=html ./all-blob-reports

      - name: Download Allure results
        uses: actions/download-artifact@v7
        with:
          pattern: raw-allure-results-*
          path: allure-results
          merge-multiple: true

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate Allure report
        run: npm run allure:generate

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: combined-playwright-html-report
          path: playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: combined-allure-html-report
          path: allure-report/
          retention-days: 30
